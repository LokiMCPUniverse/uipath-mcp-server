[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uipath-mcp-server"
version = "0.1.0"
description = "MCP server for UiPath Orchestrator API integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "asklokesh", email = "49921737+asklokesh@users.noreply.github.com" }
]
keywords = ["mcp", "uipath", "orchestrator", "rpa", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.27,<2",
    "httpx>=0.27.1,<1.0.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
uipath-mcp = "uipath_mcp:main"

[project.urls]
Homepage = "https://github.com/LokiMCPUniverse/uipath-mcp-server"
Repository = "https://github.com/LokiMCPUniverse/uipath-mcp-server"
Issues = "https://github.com/LokiMCPUniverse/uipath-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/uipath_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
